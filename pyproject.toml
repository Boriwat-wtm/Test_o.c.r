[project]
name = "thai-ocr-bench"
version = "0.1.0"
description = "เปรียบเทียบความแม่นของ OCR หลายตัวบนเอกสารภาษาไทย โดยเน้นเลขไทย เลขอารบิก และสระ/วรรณยุกต์"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "rapidfuzz>=3.9",
    "streamlit>=1.36",
]

[project.optional-dependencies]
# ติดตั้งทีหลังทีละตัว เพราะแต่ละตัวหนักและชนกันได้
tesseract = ["pytesseract>=0.3.10"]
easyocr = ["easyocr>=1.7.1"]
paddle = ["rapidocr-onnxruntime>=1.3.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thai_ocr_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
