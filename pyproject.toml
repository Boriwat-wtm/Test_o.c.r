[project]
name = "thai-ocr-bench"
version = "0.1.0"
description = "เปรียบเทียบความแม่นของ OCR หลายตัวบนเอกสารภาษาไทย โดยเน้นเลขไทย เลขอารบิก และสระ/วรรณยุกต์"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "rapidfuzz>=3.9",
    "streamlit>=1.36",
]

[project.optional-dependencies]
# ติดตั้งทีหลังทีละตัว เพราะแต่ละตัวหนักและชนกันได้
tesseract = ["pytesseract>=0.3.10"]
easyocr = ["easyocr>=1.7.2"]          # ล่าสุดจริง แต่โปรเจกต์นิ่งมาตั้งแต่ ก.ย. 2024
surya = ["surya-ocr>=0.22.1"]
paddle = ["paddleocr>=3.7.0", "paddlepaddle>=3.3.1"]
# ตัวสำรองของ paddle ถ้า paddlepaddle ติดตั้งบน Windows ไม่ผ่าน
# ใช้โมเดลชุดเดียวกันผ่าน ONNX จึงไม่ต้องพึ่ง framework ของ Paddle
# หมายเหตุ: แพ็กเกจชื่อ rapidocr-onnxruntime เลิกพัฒนาแล้ว (ค้างที่ 1.4.4)
rapid = ["rapidocr>=3.9.2", "onnxruntime>=1.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thai_ocr_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
