[project]
name = "thai-ocr-bench"
version = "0.1.0"
description = "เปรียบเทียบความแม่นของ OCR หลายตัวบนเอกสารภาษาไทย โดยเน้นเลขไทย เลขอารบิก และสระ/วรรณยุกต์"
requires-python = ">=3.12,<3.13"

dependencies = [
    "pymupdf>=1.24",
    "pillow>=10.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "rapidfuzz>=3.9",
    "streamlit>=1.36",
]

[project.optional-dependencies]
# ติดตั้งทีหลังทีละตัว เพราะแต่ละตัวหนักและชนกันได้
tesseract = ["pytesseract>=0.3.10"]
easyocr = ["easyocr>=1.7.2"]          # ล่าสุดจริง แต่โปรเจกต์นิ่งมาตั้งแต่ ก.ย. 2024
surya = ["surya-ocr>=0.22.1"]
paddle = ["paddleocr>=3.7.0", "paddlepaddle>=3.3.1"]
# ตัวสำรองของ paddle ถ้า paddlepaddle ติดตั้งบน Windows ไม่ผ่าน
# ใช้โมเดลชุดเดียวกันผ่าน ONNX จึงไม่ต้องพึ่ง framework ของ Paddle
# หมายเหตุ: แพ็กเกจชื่อ rapidocr-onnxruntime เลิกพัฒนาแล้ว (ค้างที่ 1.4.4)
rapid = ["rapidocr>=3.9.2", "onnxruntime>=1.20"]
# openai ต้องประกาศเองด้วย แม้ typhoon-ocr จะลากมาให้อยู่แล้ว
# เพราะ typhoon_api.py เรียก `from openai import OpenAI` ตรง ๆ เพื่อคุมค่า
# temperature/top_p ที่ ocr_document() ตรึงไว้ ถ้าวันหนึ่ง typhoon-ocr
# เลิกใช้ openai โค้ดเราจะพังทันทีโดยที่ uv sync ไม่เตือนอะไรเลย
typhoon = ["typhoon-ocr>=0.4.1", "openai>=1.0"]
# ThaiTrOCR โหลดโมเดลผ่าน transformers และต้องมี torch
# accelerate จำเป็นเพราะโค้ดใช้ device_map="cuda:0" ซึ่ง transformers บังคับให้มี
# ถ้าขาด engine จะรายงานว่าพร้อมใช้แล้วไปพังตอนโหลดโมเดลทุกหน้า
trocr = ["transformers>=5.0", "torch>=2.8", "accelerate>=1.0"]

# ทุก engine ที่ใช้จริง — มีไว้ให้ `uv sync --extra all` คืนสภาพแวดล้อมได้ครบ
# ถ้าไม่ประกาศไว้ตรงนี้ `uv sync` เปล่า ๆ จะถอน engine ทิ้งทั้งหมด
all = [
    "pytesseract>=0.3.10",
    "easyocr>=1.7.2",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "typhoon-ocr>=0.4.1",
    "openai>=1.0",
    "transformers>=5.0",
    "torch>=2.8",
    "accelerate>=1.0",
]

# เครื่องมือตอนพัฒนา — uv sync ติดตั้งกลุ่มนี้ให้เองโดยไม่ต้องระบุ extra
# เดิม pytest ถูกติดตั้งนอกไฟล์นี้ พอ uv sync ก็หายไปทั้งชุด
[dependency-groups]
dev = ["pytest>=8.0"]

# torch ต้องดึงจาก index ของ PyTorch ไม่ใช่ PyPI
# ถ้าประกาศแค่ "torch>=2.8" เฉย ๆ PyPI จะให้ wheel ตัว CPU บน Windows เสมอ
# แล้ว thai-trocr จะรายงานว่า "ต้องมี GPU" ทั้งที่เครื่องมีการ์ดอยู่
# ส่วน easyocr กับ paddle จะรันได้แต่ตกไปใช้ CPU ซึ่งช้ากว่ามาก
# เคยเจอมาแล้วรอบหนึ่ง: uv sync ลง 2.13.0+cpu ทับ 2.8.0+cu129 ที่ใช้อยู่
#
# ใช้ cu130 เพราะแต่ละ index มี Windows wheel ไปไม่เท่ากัน (ตรวจ cp312 win_amd64)
#   cu126 -> 2.13.0    cu128 -> 2.11.0    cu129 -> 2.9.0    cu130 -> 2.13.0
# cu129 ที่เคยใช้ตันอยู่ที่ 2.9.0 บน Windows ส่วน cu130 ตามเวอร์ชันล่าสุดได้
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # ดึงจาก index นี้เฉพาะแพ็กเกจที่ระบุไว้ข้างล่าง ไม่ใช่ทั้งหมด

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thai_ocr_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# เทสต์ที่รันหน้าเว็บทั้งหน้าใช้เวลา ~2 นาที ซึ่งเป็น 98% ของทั้งชุด
# ตัดออกจากการรันปกติ เพื่อให้ `pytest` ยังจบใน ~1 วินาทีเหมือนเดิม
# รันตัวช้าเมื่อจะ commit งานที่แตะหน้าเว็บ: pytest -m slow
addopts = "-m 'not slow'"
markers = ["slow: รันช้า (เปิดหน้าเว็บจริง) — รันด้วย pytest -m slow"]
